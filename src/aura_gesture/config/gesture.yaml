aura_camera:
  ros__parameters:
    # "0", "/dev/video0", or an MJPEG URL such as http://host.orb.internal:18090/stream.mjpg
    source: "0"
    width: 1280
    height: 720
    fps: 30.0
    jpeg_quality: 85
    frame_id: aura_camera
    image_topic: /aura/camera/image_raw/compressed
    annotation_topic: /aura/camera/annotation
    reconnect_s: 1.0

aura_gesture:
  ros__parameters:
    # Bundled with the package (share/aura_gesture/model/gesture). Relative paths are tried
    # against the working directory first, then the package share; absolute paths as given.
    model_path: model/gesture/YOLOv10n_gestures.onnx
    model_id: ""            # defaults to the model file stem
    num_threads: 4
    providers: ""           # empty = CUDA, else CPU; e.g. "TensorrtExecutionProvider,CUDAExecutionProvider,CPUExecutionProvider"
    image_topic: /aura/camera/image_raw/compressed
    hypothesis_topic: /aura/gesture/hypothesis
    intent_topic: /aura/gesture/intent
    detections_topic: /aura/gesture/detections
    min_detection_score: 0.25
    # k-of-n temporal acceptance (see aura_gesture/decision.py)
    window: 8
    min_votes: 5
    accept_threshold: 0.8
    gestures:   [thumb_up, thumb_down, fist,  palm,   point]
    intents:    [confirm,  reject,     stop,  cancel, select]
    # Operating points from the offline A/B (FA <= 1% at 0.8). The threshold applies to each
    # frame; votes = frames of the window at or above it. The confidence in GestureIntent is the
    # window mean (frames without the gesture count 0), so it is lower than the threshold.
    # Fist was 0.7 / 3 votes (~200 ms at 15 fps): a hand closing for a thumbs-up fired "stop".
    thresholds: [0.8,      0.8,        0.8,   0.8,    0.8]
    # palm and point need 6 of 8 frames: on 11 Nov both fired unintended (palm at 0.78/0.81) while every
    # deliberate fist passed with 5 of 8. Thumbs only answer questions (ignored when none is pending).
    votes:      [5,        5,          5,     6,      6]
    cooldown_s: 1.0
    rearm_frames: 3
    max_frame_age_s: 0.5
    diagnostics_period_s: 1.0
    # Annotated debug stream for rqt_image_view/Foxglove (extra JPEG encode per frame)
    publish_debug_image: false
    debug_image_topic: /aura/gesture/debug_image/compressed
    debug: false                 # true: metrics CSV, one row per accepted gesture + summary at shutdown (launch: debug:=true)
    metrics_dir: aura_metrics    # relative to the working directory
