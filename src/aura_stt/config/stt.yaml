aura_stt:
  ros__parameters:
    # Relative to the working directory; run from the project root or override.
    # AURA_STT_MODEL_DIR, when set, takes precedence over this value.
    model_dir: model
    device: cpu
    input_device: ""
    input_sample_rate: 0  # auto: probe supported capture rates, preferring 48 kHz
    capture_channels: 0  # auto: try stereo, mono, then the full native channel count
    capture_block_ms: 100
    input_latency: 0.0  # 0 uses the device's high-latency setting; otherwise seconds
    prefer_usb: true
    include_internal: false  # prefer external inputs; internal inputs remain eligible
    audio_file: ""  # optional real-time replay of a 16 kHz mono PCM16 recording
    latency_ms: 560
    num_threads: 4
    debug_audio: false
    debug: false                 # true: metrics CSV, one row per utterance + summary at shutdown (launch: debug:=true)
    metrics_dir: aura_metrics    # relative to the working directory
    transcript_topic: /aura_transcript
    partial_topic: /aura_partial_transcript
    # Robot speech in the microphone. speaking_topic is aura_tts's playback state; "" disables all
    # echo handling (not recommended: the robot then hears its own "Stop, executing." and loops).
    #   echo_mode filter: the microphone stays open. While the robot talks, the words of the sentences
    #     it plays (robot_text_topic) are removed from the transcript and only the operator's words are
    #     forwarded, so "stop" is heard during a question. A stop/pause is sent from the partial
    #     transcript at once, without waiting for the robot to finish.
    #   echo_mode mute: the microphone is muted while the robot talks and echo_tail_s after
    #     (round-2 behaviour; a command spoken while the robot talks is lost).
    speaking_topic: /aura/speaker/speaking
    echo_mode: filter
    robot_text_topic: /aura/speaker/say
    echo_tail_s: 0.4
    echo_similarity: 0.75
    # Save each utterance as a 16 kHz WAV in <metrics_dir>/audio (file name in the metrics CSV).
    record_audio: false
    speech_threshold_db: -40.0
    silence_s: 0.8
    pre_roll_s: 0.3
    max_utterance_s: 20.0
