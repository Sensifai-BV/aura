# AURA × ARISE all-in-one middleware — local stack
#
# ROS 2 (DDS) ──▶ Orion-LD native DDS bridge (ARISE D2.1, Phase I) ──▶ TROE/TimescaleDB ──▶ Mintaka / Grafana
#                         └─ subscriptions ──▶ ngsi-proxy ──▶ WireCloud (AURA widgets) · aura-monitor (KPIs, alerts, reports)
#
#   docker compose up -d --build
#
# artaban-ros2 publishes the Artaban / AURA topics until the robot and the real AURA modules publish
# them on the same DDS domain; stop it then (docker compose stop artaban-ros2).
name: aura-fiware

x-pg-env: &pg-env
  PGHOST: timescale
  PGPORT: "5432"
  PGUSER: orion
  PGPASSWORD: orion
  PGDATABASE: orion

services:
  mongo:
    image: mongo:7.0
    command: --bind_ip_all --quiet
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 10

  timescale:
    image: timescale/timescaledb-ha:pg17-ts2.18
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion"]
      interval: 10s
      retries: 10
      start_period: 30s

  orion:
    image: fiware/orion-ld:1.10.0
    platform: linux/amd64
    privileged: true
    ipc: host
    depends_on:
      mongo: { condition: service_healthy }
      timescale: { condition: service_healthy }
    restart: unless-stopped
    # -wip dds: native ROS 2 / DDS ⇄ NGSI-LD bridge; topic → attribute mapping in orion/config-dds.json
    command: -dbhost mongo -mongocOnly -logLevel WARN -wip dds
    environment:
      ORIONLD_MONGO_HOST: mongo
      ORIONLD_TROE: "TRUE"
      ORIONLD_TROE_HOST: timescale
      ORIONLD_TROE_PORT: "5432"
      ORIONLD_TROE_USER: orion
      ORIONLD_TROE_PWD: orion
    volumes:
      - ./orion/config-dds.json:/root/.orionld:ro
    ports:
      - "1026:1026"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:1026/version || exit 1"]
      interval: 10s
      retries: 15

  mintaka:
    image: fiware/mintaka:0.6.18
    depends_on:
      orion: { condition: service_healthy }
    restart: unless-stopped
    environment:
      MICRONAUT_SERVER_PORT: "8080"
      ENDPOINTS_ALL_PORT: "8080"
      ENDPOINTS_HEALTH_ENABLED: "true"
      DATASOURCES_DEFAULT_HOST: timescale
      DATASOURCES_DEFAULT_PORT: "5432"
      DATASOURCES_DEFAULT_USERNAME: orion
      DATASOURCES_DEFAULT_PASSWORD: orion
      DATASOURCES_DEFAULT_DATABASE: orion
    ports:
      - "8080:8080"

  # ROS 2 publisher for the Artaban / AURA topics (Vulcanexus, DDS domain 0).
  artaban-ros2:
    build:
      context: ..
      dockerfile: fiware/ros2/Dockerfile
    depends_on:
      orion: { condition: service_healthy }
    restart: unless-stopped
    ipc: host
    environment:
      ROS_DOMAIN_ID: "0"
      SIM_RATE_HZ: "1"
      SIM_MISSION_MINUTES: "12"
      SIM_MISSION_ID: ${SIM_MISSION_ID:-}
      SIM_TOPICS: ${SIM_TOPICS:-all}   # platform = robot platform only; the other AURA modules publish their own

  aura-monitor:
    build: ./monitor
    depends_on:
      orion: { condition: service_healthy }
    restart: unless-stopped
    environment:
      <<: *pg-env
      ORION_URL: http://orion:1026
      MINTAKA_URL: http://mintaka:8080
      GRAFANA_URL: http://grafana:3000
      GRAFANA_PUBLIC_URL: http://localhost:3000
      MONITOR_NOTIFY_URL: http://aura-monitor:8090/ngsi-ld/notify
    ports:
      - "8090:8090"

  grafana:
    image: grafana/grafana:11.5.2
    depends_on:
      timescale: { condition: service_healthy }
    restart: unless-stopped
    environment:
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aura/01-artaban-telemetry.json
      GF_USERS_DEFAULT_THEME: dark
      POSTGRES_PASSWORD: orion   # interpolated into the provisioned datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/aura:ro
    ports:
      - "3000:3000"

  # --- WireCloud: FIWARE dashboard GE (AURA widgets live here) -------------------------------
  wirecloud:
    image: fiware/wirecloud:1.3.1
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DEBUG: "False"
      FORWARDED_ALLOW_IPS: "*"
      LOGLEVEL: info
    volumes:
      - wirecloud-data:/opt/wirecloud_instance/data
      - wirecloud-static:/var/www/static
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/api/features >/dev/null || exit 1"]
      interval: 15s
      retries: 20
      start_period: 60s

  wirecloud-nginx:
    image: nginx:1.27.3-alpine
    depends_on:
      - wirecloud
    restart: unless-stopped
    volumes:
      - ./wirecloud/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wirecloud-static:/var/www/static:ro
    ports:
      - "8000:80"

  # Relays Orion-LD notifications to widgets as EventSource streams (FIWARE ngsi-proxy).
  ngsiproxy:
    image: fiware/ngsiproxy:1.2.2
    platform: linux/amd64
    restart: unless-stopped
    environment:
      PORT: "3001"   # ngsi-proxy builds its URLs from its own port, so keep host and container ports equal
    ports:
      - "3001:3001"

  # One-shot: admin user, AURA widgets/operator/mashup into the catalogue, AURA workspace.
  wirecloud-init:
    image: fiware/wirecloud:1.3.1
    platform: linux/amd64
    depends_on:
      wirecloud: { condition: service_healthy }
    restart: "no"
    environment:
      AURA_VERSION: "1.2.3"                                   # keep equal to VERSION in wirecloud/build.py
      AURA_RECREATE_WORKSPACE: ${AURA_RECREATE_WORKSPACE:-0}  # 1 = rebuild admin/aura from the mashup
    volumes:
      - wirecloud-data:/opt/wirecloud_instance/data
      - ./wirecloud:/aura/src:ro
      - ./wirecloud/init.sh:/aura/init.sh:ro
    entrypoint: ["bash", "/aura/init.sh"]

volumes:
  mongo-data:
  timescale-data:
  wirecloud-data:
  wirecloud-static:
