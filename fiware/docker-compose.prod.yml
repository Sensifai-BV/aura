# AURA x ARISE middleware - PRODUCTION (Coolify, server-2, project "aura", environment "production").
#
#   Real Artaban robot  --DDS domain 0--> orion      -> mintaka      -> aura-monitor   -> WireCloud dashboard "Aura"
#   Test publishers     --DDS domain 1--> orion-sim  -> mintaka-sim  -> monitor-sim    -> WireCloud dashboard "Simulator"
#
# Both dashboards use the same widgets; they differ only in which broker they read (see wirecloud/build.py).
# Mongo and TimescaleDB are shared: each Orion-LD keeps its own database (orion / orion_sim), so the two data planes
# never mix.
#
# Configuration files are baked into small images (deploy/*.Dockerfile): Coolify does not copy repository files for
# relative bind mounts of a Git compose application, it creates empty folders instead.
#
# Public surface: only WireCloud (HTTPS via Traefik) and the DDS UDP ports below. Orion-LD HTTP, Mintaka, Mongo,
# Postgres and the monitors are NOT published. Secrets come from Coolify (SERVICE_PASSWORD_* are generated by Coolify).
#
# Robot link (domain 0): TCP 11800 -> ddsrouter (TLS), which bridges to Orion-LD inside the Docker network. Restrict
# 11800 to the robot's address at the host / cloud firewall (the TLS here authenticates the server, not the client).
# Simulator (domain 1): TCP 11801 -> ddsrouter-sim (TLS, same CA as the robot link) -> orion-sim. Test and integration
# publishers connect from anywhere as a DDS Router client (tools/sim_link); nothing on the server generates data.
name: aura-arise

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # ------------------------------------------------------------------ data stores (shared)
  mongo:
    image: mongo:7.0
    command: --bind_ip_all --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    mem_limit: 640m
    cpus: 0.75
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      retries: 10
    <<: *logging

  timescale:
    image: timescale/timescaledb-ha:pg17-ts2.18
    # default 100 connections ran out with the real robot (Orion-LD, Orion-LD sim, 2x Mintaka, 2x monitor, Grafana)
    command: postgres -c max_connections=300
    restart: unless-stopped
    mem_limit: 1280m
    cpus: 1.0
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - timescale-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion"]
      interval: 15s
      retries: 10
      start_period: 45s
    <<: *logging

  # ------------------------------------------------------------------ Aura: real robot (DDS domain 0)
  orion:
    build:
      context: .
      dockerfile: deploy/orion.Dockerfile
      args:
        DDS_CONFIG: orion/config-dds.json
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      mongo: { condition: service_healthy }
      timescale: { condition: service_healthy }
    # -wip dds: native ROS 2 / DDS <-> NGSI-LD bridge (ARISE D2.1, Phase I); topic mapping in orion/config-dds.json
    command: -dbhost mongo -db orion -mongocOnly -logLevel WARN -wip dds -port 1026
    environment:
      ORIONLD_MONGO_HOST: mongo
      ORIONLD_TROE: "TRUE"
      ORIONLD_TROE_HOST: timescale
      ORIONLD_TROE_PORT: "5432"
      ORIONLD_TROE_USER: orion
      ORIONLD_TROE_PWD: ${SERVICE_PASSWORD_POSTGRES}
    # no published DDS ports: the robot reaches this broker through the TLS tunnel of "ddsrouter" below
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:1026/version || exit 1"]
      interval: 15s
      retries: 15
    <<: *logging

  # WAN link for the real robot: eProsima DDS Router (server role). The robot runs the same image as a client and only
  # needs an outbound TCP connection to port 11800 (works behind NAT). The link is TLS encrypted; on first start the
  # server creates its own CA and certificate in the volume and prints the CA (TLS_CA_B64=...) in its log: give that to
  # the robot. A small ROS 2 node in the container announces the message types so Orion-LD subscribes.
  ddsrouter:
    build:
      context: ..
      dockerfile: fiware/deploy/ddsrouter.Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      orion: { condition: service_healthy }
    environment:
      ROLE: server
      DDS_DOMAIN: "0"
      LOCAL_PEERS: orion
      WAN_PORT: "11800"
      TLS_SAN: ${DDS_TLS_SAN:-DNS:aura-dds.sensifai.com,IP:95.217.135.234}
      # the address the robot connects to, announced instead of the container's private address (required behind NAT)
      PUBLIC_ADDRESS: ${DDS_PUBLIC_ADDRESS:-95.217.135.234}
    ports:
      - "11800:11800/tcp"
    volumes:
      - ddsrouter-data:/data
    <<: *logging

  mintaka:
    image: fiware/mintaka:0.6.18
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.5
    depends_on:
      orion: { condition: service_healthy }
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx448m -XX:MaxMetaspaceSize=128m"
      MICRONAUT_SERVER_PORT: "8080"
      ENDPOINTS_ALL_PORT: "8080"
      ENDPOINTS_HEALTH_ENABLED: "true"
      DATASOURCES_DEFAULT_HOST: timescale
      DATASOURCES_DEFAULT_PORT: "5432"
      DATASOURCES_DEFAULT_USERNAME: orion
      DATASOURCES_DEFAULT_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      DATASOURCES_DEFAULT_DATABASE: orion
    <<: *logging

  aura-monitor:
    build: ./monitor
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    depends_on:
      orion: { condition: service_healthy }
    environment:
      PGHOST: timescale
      PGPORT: "5432"
      PGUSER: orion
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      PGDATABASE: orion
      ORION_URL: http://orion:1026
      MINTAKA_URL: http://mintaka:8080
      GRAFANA_URL: http://grafana:3000
      GRAFANA_PUBLIC_URL: ${ARISE_PUBLIC_URL:-https://aura-dash.sensifai.com}/grafana
      MONITOR_NOTIFY_URL: http://aura-monitor:8090/ngsi-ld/notify
    <<: *logging

  # ------------------------------------------------------------------ Simulator: test and debug (DDS domain 1)
  orion-sim:
    build:
      context: .
      dockerfile: deploy/orion.Dockerfile
      args:
        DDS_CONFIG: orion/config-dds-sim.json
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      mongo: { condition: service_healthy }
      timescale: { condition: service_healthy }
    command: -dbhost mongo -db orion_sim -mongocOnly -logLevel WARN -wip dds -port 1026
    environment:
      ORIONLD_MONGO_HOST: mongo
      ORIONLD_TROE: "TRUE"
      ORIONLD_TROE_HOST: timescale
      ORIONLD_TROE_PORT: "5432"
      ORIONLD_TROE_USER: orion
      ORIONLD_TROE_PWD: ${SERVICE_PASSWORD_POSTGRES}
    # no published DDS ports: test publishers reach this broker through "ddsrouter-sim"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:1026/version || exit 1"]
      interval: 15s
      retries: 15
    <<: *logging

  mintaka-sim:
    image: fiware/mintaka:0.6.18
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.5
    depends_on:
      orion-sim: { condition: service_healthy }
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx448m -XX:MaxMetaspaceSize=128m"
      MICRONAUT_SERVER_PORT: "8080"
      ENDPOINTS_ALL_PORT: "8080"
      ENDPOINTS_HEALTH_ENABLED: "true"
      DATASOURCES_DEFAULT_HOST: timescale
      DATASOURCES_DEFAULT_PORT: "5432"
      DATASOURCES_DEFAULT_USERNAME: orion
      DATASOURCES_DEFAULT_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      DATASOURCES_DEFAULT_DATABASE: orion_sim
    <<: *logging

  monitor-sim:
    build: ./monitor
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    depends_on:
      orion-sim: { condition: service_healthy }
    environment:
      PGHOST: timescale
      PGPORT: "5432"
      PGUSER: orion
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      PGDATABASE: orion_sim
      ORION_URL: http://orion-sim:1026
      MINTAKA_URL: http://mintaka-sim:8080
      GRAFANA_URL: http://grafana:3000
      GRAFANA_PUBLIC_URL: ${ARISE_PUBLIC_URL:-https://aura-dash.sensifai.com}/grafana
      MONITOR_NOTIFY_URL: http://monitor-sim:8090/ngsi-ld/notify
    <<: *logging

  # WAN link for test and integration publishers (Simulator plane, DDS domain 1): the same DDS Router as the robot link,
  # on its own port. It reuses the robot link's certificate (read-only volume), so one CA serves both links.
  ddsrouter-sim:
    build:
      context: ..
      dockerfile: fiware/deploy/ddsrouter.Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      orion-sim: { condition: service_healthy }
      ddsrouter: { condition: service_started }
    environment:
      ROLE: server
      DDS_DOMAIN: "1"
      DDS_CONFIG: /etc/aura/config-dds-sim.json
      LOCAL_PEERS: orion-sim
      WAN_PORT: "11801"
      TLS_SAN: ${DDS_TLS_SAN:-DNS:aura-dds.sensifai.com,IP:95.217.135.234}
      PUBLIC_ADDRESS: ${DDS_PUBLIC_ADDRESS:-95.217.135.234}
    ports:
      - "11801:11801/tcp"
    volumes:
      - ddsrouter-data:/data:ro
    <<: *logging

  # ------------------------------------------------------------------ Grafana (ARISE standard dashboards, Aura data)
  grafana:
    build:
      context: .
      dockerfile: deploy/grafana.Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      timescale: { condition: service_healthy }
    environment:
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_SECURITY_ADMIN_USER: ${ARISE_ADMIN_USER:-arise-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${SERVICE_PASSWORD_GRAFANA}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SERVER_ROOT_URL: ${ARISE_PUBLIC_URL:-https://aura-dash.sensifai.com}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aura/01-artaban-telemetry.json
      GF_USERS_DEFAULT_THEME: dark
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}   # interpolated into the provisioned datasource
    volumes:
      - grafana-data:/var/lib/grafana
    <<: *logging

  # ------------------------------------------------------------------ WireCloud (public: Aura + Simulator dashboards)
  wirecloud:
    image: fiware/wirecloud:1.3.1
    platform: linux/amd64
    restart: unless-stopped
    # no resource limit on purpose (the dashboard is the public entry point)
    environment:
      DEBUG: "False"
      LOGLEVEL: info
      FORWARDED_ALLOW_IPS: "*"
      ALLOWED_HOSTS: aura-dash.sensifai.com wirecloud wirecloud-nginx localhost
      SECRET_KEY: ${SERVICE_PASSWORD_64_WIRECLOUDKEY}
      CSRF_COOKIE_SECURE: "true"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_HTTPONLY: "true"
    volumes:
      - wirecloud-data:/opt/wirecloud_instance/data
      - wirecloud-static:/var/www/static
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/api/features >/dev/null || exit 1"]
      interval: 15s
      retries: 20
      start_period: 90s
    <<: *logging

  wirecloud-nginx:
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    depends_on:
      - wirecloud
    volumes:
      - wirecloud-static:/var/www/static:ro
    <<: *logging

  # Relays Orion-LD notifications to the browser as EventSource streams (shared by both dashboards).
  ngsiproxy:
    image: fiware/ngsiproxy:1.2.2
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 160m
    cpus: 0.25
    environment:
      PORT: "3001"
      TRUST_PROXY_HEADERS: "1"   # build public URLs from X-Forwarded-Proto / -Port set by nginx
    <<: *logging

  # One-shot and idempotent: builds the widgets, creates the admin account and the two dashboards.
  wirecloud-init:
    build:
      context: .
      dockerfile: deploy/wirecloud-init.Dockerfile
    platform: linux/amd64
    restart: "no"
    mem_limit: 512m
    cpus: 0.5
    exclude_from_hc: true
    depends_on:
      wirecloud:
        condition: service_healthy
    environment:
      AURA_VERSION: "1.2.5"                      # keep equal to VERSION in wirecloud/build.py
      AURA_RECREATE_WORKSPACE: ${AURA_RECREATE_WORKSPACE:-0}
      ARISE_PUBLIC_URL: ${ARISE_PUBLIC_URL:-https://aura-dash.sensifai.com}
      WIRECLOUD_ADMIN_USER: ${ARISE_ADMIN_USER:-arise-admin}
      WIRECLOUD_ADMIN_PASSWORD: ${SERVICE_PASSWORD_WIRECLOUD}
    volumes:
      - wirecloud-data:/opt/wirecloud_instance/data
    entrypoint: ["bash", "/aura/init.sh"]
    <<: *logging

volumes:
  mongo-data:
  timescale-data:
  grafana-data:
  wirecloud-data:
  ddsrouter-data:
  wirecloud-static:
