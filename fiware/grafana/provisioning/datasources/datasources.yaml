apiVersion: 1

datasources:
  # TROE historian written by Orion-LD (tables `entities`, `attributes`, `subattributes`).
  - name: AURA TimescaleDB (TROE)
    uid: aura-timescale
    type: grafana-postgresql-datasource
    url: timescale:5432
    user: orion
    isDefault: true
    editable: false
    jsonData:
      database: orion
      sslmode: disable
      timescaledb: true
      postgresVersion: 1700
      maxOpenConns: 10
    secureJsonData:
      password: ${POSTGRES_PASSWORD}

  # NGSI-LD APIs: Mintaka temporal API and Orion-LD current-state API.
  - name: AURA NGSI-LD (Mintaka / Orion-LD)
    uid: aura-mintaka
    type: yesoreyeram-infinity-datasource
    editable: false
    jsonData:
      auth_method: none
      allowedHosts:
        - http://mintaka:8080
        - http://orion:1026
      global_queries: []
