# WireCloud behind nginx for production: Traefik (Coolify) terminates TLS and forwards to this server.
# Only what the browser needs is exposed here; Orion-LD, Mintaka and the monitors stay on the internal network
# (WireCloud's own proxy reaches them server-side).
map $http_x_forwarded_proto $xf_proto { default $http_x_forwarded_proto; "" $scheme; }

# Upstreams are resolved per request through Docker's DNS, so nginx starts even when Grafana, ngsi-proxy or a monitor is
# still starting (a literal host name in proxy_pass must resolve at start-up, or nginx exits and keeps restarting).
resolver 127.0.0.11 valid=10s ipv6=off;

# Widget files: WireCloud serves them from /showcase/media/<vendor>/<widget>/<version>/... with no cache headers at all, so
# every dashboard load fetched every file of all 14 widgets again. The version is part of the URL, so caching is safe;
# a changed widget ships as a new version (see docs/PRODUCTION.md).
proxy_cache_path /var/cache/nginx/aura levels=1:2 keys_zone=aura_media:10m max_size=200m inactive=7d use_temp_path=off;

server {
    listen 80;
    set $wirecloud_up http://wirecloud:8000;
    set $ngsiproxy_up http://ngsiproxy:3001;
    set $grafana_up   http://grafana:3000;

    server_name _;
    client_max_body_size 20M;

    location /static {
        alias /var/www/static;
        expires 1h;
    }

    # Live updates: the browser opens an EventSource on ngsi-proxy. ngsi-proxy builds absolute URLs from the
    # forwarded headers (TRUST_PROXY_HEADERS) and ignores any path prefix, so it must live at /eventsource.
    location /eventsource {
        proxy_pass $ngsiproxy_up;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $xf_proto;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Grafana (ARISE standard dashboards), served under /grafana/ with its own login.
    location /grafana/ {
        proxy_pass $grafana_up;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $xf_proto;
    }
    location /grafana/api/live/ {
        proxy_pass $grafana_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }

    # Printable mission reports (read only, GET): the monitors' APIs are NOT exposed.
    location ~ ^/monitor/aura/(reports/[^/]+)$ {
        limit_except GET { deny all; }
        proxy_pass http://aura-monitor:8090/$1;
        proxy_set_header Host $http_host;
    }
    location ~ ^/monitor/sim/(reports/[^/]+)$ {
        limit_except GET { deny all; }
        proxy_pass http://monitor-sim:8090/$1;
        proxy_set_header Host $http_host;
    }

    location /showcase/media/ {
        proxy_pass $wirecloud_up;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $xf_proto;
        proxy_cache aura_media;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Set-Cookie Vary;      # session cookies and Vary: Cookie would make every response uncacheable
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        proxy_pass $wirecloud_up;
        # Cloudflare turns WireCloud's "304 Not Modified" answers into 520 errors (any request with If-None-Match, which
        # the browser sends on every reload once it has a cached copy). Never let a conditional request reach WireCloud:
        # it always answers 200, and the responses are small.
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $xf_proto;
        proxy_read_timeout 300s;
    }
}
